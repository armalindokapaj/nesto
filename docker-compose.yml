# Local development infrastructure (PRD §5.1 "Local | Docker Compose").
# Nothing here is a production topology; it exists so that every code path the
# platform takes in production is exercised locally against the real component
# rather than a stub.
name: nesto

services:
  postgres:
    image: postgres:17-alpine
    container_name: nesto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nesto
      POSTGRES_PASSWORD: nesto_dev
      POSTGRES_DB: nesto
      # Deterministic collation: index order must not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      # Small, deliberate tuning so local timings resemble a real server rather
      # than a machine that fits the whole database in shared_buffers by luck.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesto -d nesto"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nesto-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible private object storage (PRD §21). Two buckets are created by
  # the init container: quarantine for freshly uploaded bytes, objects for
  # anything that has passed inspection.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: nesto-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: nesto
      MINIO_ROOT_PASSWORD: nesto_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: nesto-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nesto nesto_dev_secret;
      mc mb --ignore-existing local/nesto-objects;
      mc mb --ignore-existing local/nesto-quarantine;
      mc anonymous set none local/nesto-objects;
      mc anonymous set none local/nesto-quarantine;
      echo 'buckets ready, both private';
      "

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: nesto-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000

volumes:
  pgdata:
  redisdata:
  miniodata:
