name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first — CI should report on the
# tip of a branch, not queue up behind every intermediate commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres container, deliberately not a Neon branch: a
    # branch-per-PR is a nice-to-have, and this proves the same thing for free.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # schema.prisma splits directUrl out for migrations against Neon's pooler.
      # In CI both point at the same unpooled container.
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: ci-only-secret-do-not-use-in-prod
      NEXTAUTH_URL: http://localhost:3100
      # File storage: the local-filesystem driver, so CI needs no Blob token.
      BLOB_DRIVER: local

    # The Next app lives in NestoWeb/, not the repository root.
    defaults:
      run:
        working-directory: NestoWeb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: NestoWeb/package-lock.json

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # The e2e suite signs in as seeded users, so the database has to be
      # populated before Playwright starts.
      - name: Seed database
        run: npm run db:seed:all

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # NOT blocking yet, deliberately — and this is the one step that should
      # change soonest.
      #
      # 58 of 120 pass; about 15 specs assert against a UI that commit b82fb16
      # reworked without updating them (for instance role-context-navigation
      # expects a "Budget vs Actual" sidebar link that the Finance nav rework
      # removed). Those failures predate this pipeline and are not regressions.
      #
      # Gating merges on a job that is red for reasons nobody introduced today
      # trains everyone to ignore CI, which is worse than having none. The
      # steps above — typecheck, lint, unit — are green and DO gate. Once the
      # stale specs are repaired, delete continue-on-error and add this job to
      # the branch protection required checks.
      - name: E2E (advisory until stale specs are repaired)
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: NestoWeb/playwright-report/
          retention-days: 7
