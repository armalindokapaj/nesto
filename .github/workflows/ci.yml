name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first — CI reports on the tip of
# a branch, not on every intermediate commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runtime connects as nesto_app, which is NOBYPASSRLS. Connecting as the owner
  # would make the isolation suite pass while proving nothing (ADR-0002).
  DATABASE_URL: postgresql://nesto_app:nesto_app_dev@localhost:5432/nesto?schema=public
  DATABASE_URL_DIRECT: postgresql://nesto:nesto_dev@localhost:5432/nesto?schema=public
  REDIS_URL: redis://localhost:6379
  AUTH_ACCESS_SECRET: ci-access-secret-of-sufficient-length-0123456789
  AUTH_REFRESH_PEPPER: ci-refresh-pepper-of-sufficient-length-0123456
  CRYPTO_KEK: Y2ktb25seS1rZXktZW5jcnlwdGlvbi1rZXktMzJieXRl
  STORAGE_ENDPOINT: http://localhost:9000
  STORAGE_REGION: eu-central-1
  STORAGE_ACCESS_KEY: nesto
  STORAGE_SECRET_KEY: nesto_dev_secret
  STORAGE_BUCKET_OBJECTS: nesto-objects
  STORAGE_BUCKET_QUARANTINE: nesto-quarantine
  MALWARE_SCANNER: permissive-dev
  NODE_ENV: test

jobs:
  quality:
    name: typecheck, architecture and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      # Architecture before unit tests: a boundary violation makes every other
      # result untrustworthy, so it should be the first thing to go red.
      - name: Architecture boundaries
        run: pnpm --filter @nesto/testing test
      - name: Unit tests
        run: pnpm turbo run test

  integration:
    name: integration, isolation and concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nesto
          POSTGRES_PASSWORD: nesto_dev
          POSTGRES_DB: nesto
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nesto" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: nesto
          MINIO_ROOT_PASSWORD: nesto_dev_secret
          MINIO_DEFAULT_BUCKETS: nesto-objects,nesto-quarantine
        ports: ["9000:9000"]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Apply migrations
        run: pnpm db:deploy

      # The suite that matters most: every assertion is "this must NOT be
      # possible". §26.2's matrix, run against real Postgres with RLS forced.
      - name: Isolation and concurrency
        run: pnpm --filter @nesto/database test:integration

      - name: Outbox, inbox and audit chain
        run: pnpm --filter @nesto/worker test:integration

      # An event's meaning is immutable once published (§20.2). This is the
      # check that a schema change is additive or a new version.
      - name: Event registry compatibility
        run: pnpm --filter @nesto/events test

      - name: API smoke
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4000/health | grep -q '"status":"ok"'
          curl -sf http://localhost:4000/ready  | grep -q '"status":"ready"'
          # The OpenAPI document is the published contract; a build that cannot
          # produce it has broken the thing every client is generated from.
          curl -sf http://localhost:4000/api/openapi.json | grep -q '"openapi"'
          kill $API_PID

  security:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high || true

      # A committed .env is the single most common way a real secret leaks out
      # of a repository like this one.
      - name: No committed environment files
        run: |
          if git ls-files | grep -E '^\.env$|/\.env$'; then
            echo "A .env file is committed. Only .env.example belongs in the repository."
            exit 1
          fi

      - name: No permissive scanner in production config
        run: |
          if grep -rn "MALWARE_SCANNER=permissive-dev" --include="*.yml" --include="*.yaml" . \
             | grep -v ".github/workflows/ci.yml" | grep -iE "prod"; then
            echo "The permissive-dev scanner is referenced in a production configuration."
            exit 1
          fi
